name: parallel-review
mode: review
passContext: true
steps:
  - id: map
    prompt: "Map the repository: list the main modules and their responsibilities."
  - id: review-group
    dependsOn: map
    parallel:
      - id: review-security
        agent: reviewer
        prompt: "Review the diff for security risks: injection, secrets, auth."
      - id: review-style
        agent: reviewer
        prompt: "Review the diff for style, naming, and consistency issues."
  - id: summarize
    dependsOn: review-group
    prompt: "Combine the security and style findings into a single prioritized list with fixes."
